# Builds Nim repos with the latest nimble release and with nimble HEAD (the
# nightly build), and fails when a repo gets less far with HEAD: a regression
# we'd otherwise ship. The repos are those of the packages Nim's CI tests,
# which every run reads from Nim devel's testament/important_packages.nim, and
# Status' and the community's in .github/canary/repos.txt. Every repo builds the
# same way, the way a nimble package should build in CI (the build job below):
# setup-nimble-action installs nimble, nimble installs Nim and the dependencies,
# `nimble setup` points the compiler at them, and `nimble test` runs the tests.
# The canary's own steps are the tasks of the nimble package in .github/canary.
# To try a branch or a PR on a few repos:
#   gh workflow run canary.yml -f nimble-ref=refs/pull/<n>/head -f repos=status-im/nim-chronos
#
# The build jobs run the repos' own code, so they get no secrets and a read-only
# token, and checkouts don't keep credentials.
name: Canary

on:
  schedule:
    # When nim-lang's own CI, which shares the runners, is quietest, and not on
    # the hour: GitHub delays those runs (at 03:00, they started 5-7 hours late).
    - cron: "41 22 * * *"
  workflow_dispatch:
    inputs:
      nimble-ref:
        description: "nimble to test instead of the nightly build: a branch, tag, SHA or refs/pull/<n>/head (built from source)"
        default: ""
      baseline:
        description: "nimble release to compare with (default: the latest)"
        default: ""
      repos:
        description: "Comma-separated repos, from repos.txt or Nim CI's packages (default: all)"
        default: ""
      tests:
        description: "Run nimble test (off: install the dependencies only)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: canary-${{ inputs.nimble-ref || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # the last scheduled run's times, to start the slowest repos first
    outputs:
      runner: ${{ steps.release.outputs.latest }}
      baseline: ${{ steps.release.outputs.baseline }}
      matrix: ${{ steps.plan.outputs.matrix }}
      more: ${{ steps.plan.outputs.more }}
      head: ${{ steps.plan.outputs.head }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/canary
          persist-credentials: false
      - name: Find the latest nimble release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE: ${{ inputs.baseline }}
        run: |
          latest=$(gh api repos/nim-lang/nimble/releases/latest --jq .tag_name)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "baseline=${BASELINE:-$latest}" >> "$GITHUB_OUTPUT"
      # The latest release runs the canary's tasks, and installs their Nim.
      - uses: nim-lang/setup-nimble-action@v2
        with:
          nimble-version: ${{ steps.release.outputs.latest }}
          repo-token: ${{ github.token }}
      - id: plan
        working-directory: .github/canary
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE: ${{ steps.release.outputs.baseline }}
          NIMBLE_REF: ${{ inputs.nimble-ref }}
          ONLY: ${{ inputs.repos }}
          TESTS: ${{ inputs.tests }}
        run: nimble -y plan

  build:
    needs: plan
    # The report finds the jobs by this name.
    name: ${{ matrix.repo }} (${{ matrix.nimble }})
    # Status needs GCC >= 14 and Clang >= 20; ubuntu-latest once that is 26.04.
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    # A repo that fails to build doesn't fail the run; the report does, when it
    # gets less far with head.
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # How a nimble package builds: nimble installs the Nim and the dependencies
    # the package requires, then runs its tests. The report reads these steps'
    # names.
    steps: &build
      # The same commit for both nimbles, fetched without credentials: the repos
      # are public. Not actions/checkout: without persisted credentials it runs
      # `git submodule foreach` to remove them, which fails on a repo with a
      # broken submodule (mratsim/weave's has no URL).
      - name: Check out the repo
        env:
          REPO: ${{ matrix.repo }}
          SHA: ${{ matrix.sha }}
        run: |
          git init -q .
          git remote add origin "https://github.com/$REPO"
          for attempt in 1 2 3; do
            git -c protocol.version=2 fetch -q --no-tags --depth=1 origin "$SHA" && break
            sleep 15
          done
          git checkout -q FETCH_HEAD
      # The submodules, fetched as actions/checkout fetches them, except that one
      # the repo breaks doesn't stop the build: a build that needs it fails with
      # both nimbles.
      - name: Fetch submodules
        run: >-
          git -c protocol.version=2 -c url.https://github.com/.insteadOf=git@github.com:
          submodule update --init --force --depth=1 --recursive
          || echo "::warning::Some submodules couldn't be fetched"
      - name: Set up nimble
        uses: nim-lang/setup-nimble-action@v2
        with:
          nimble-version: ${{ matrix.version }}
          repo-token: ${{ github.token }}
      # Where nimble links the dependencies' binaries, such as testutils' ntu.
      - name: Add nimble's bin to PATH
        run: echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        timeout-minutes: 30
        run: nimble install -y --depsOnly
      # `nimble setup` writes nimble.paths, so the tests see only the
      # dependencies nimble resolved; without it, a config.nims with
      # --noNimblePath finds none (langserver, neverwinter.nim).
      - name: Test
        if: matrix.tests
        timeout-minutes: 90
        run: |
          nimble setup -y
          nimble test

  # A matrix has at most 256 jobs, so the plan puts the rest in `more`: the same
  # build (*build), once the first jobs are done.
  build-more:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.outputs.more != '[]' }}
    name: ${{ matrix.repo }} (${{ matrix.nimble }})
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.more) }}
    steps: *build

  report:
    needs: [plan, build, build-more]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # the build jobs' results
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/canary
          persist-credentials: false
      - uses: nim-lang/setup-nimble-action@v2
        with:
          nimble-version: ${{ needs.plan.outputs.runner }}
          repo-token: ${{ github.token }}
      - name: Report
        working-directory: .github/canary
        env:
          GH_TOKEN: ${{ github.token }}
          PLANNED: ${{ needs.plan.outputs.matrix }}
          PLANNED_MORE: ${{ needs.plan.outputs.more }}
          BASELINE: ${{ needs.plan.outputs.baseline }}
          HEAD_LABEL: ${{ needs.plan.outputs.head }}
        run: nimble -y report
